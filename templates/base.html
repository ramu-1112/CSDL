<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Quản lý bán hàng{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f7fa}.card{border:0}.nav-tabs .nav-link{color:#495057}.invoice-paper{background:#fff}.form-control.is-valid,.form-select.is-valid{border-color:#198754}.form-control.is-invalid,.form-select.is-invalid{border-color:#dc3545}.validation-message{min-height:1.1rem}</style></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="{{ url_for('home') }}">Quản lý bán hàng & vận chuyển</a></div></nav><main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}{% for category,message in messages %}<div class="alert {{ 'alert-success' if category=='success' else 'alert-danger' }} alert-dismissible fade show">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
